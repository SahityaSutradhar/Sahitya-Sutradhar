<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#641f2b"><meta name="description" content="साहित्य सूत्रधार — मोबाइल रीडर">
<title>रचना पढ़ें — साहित्य सूत्रधार</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="mobile-app.css?v=2"><link rel="stylesheet" href="mobile-reader.css?v=1">
</head>
<body class="reader-page">
<div class="app-frame reader-frame">
<header class="app-header reader-header"><a class="back-link" href="mobile-app.html" aria-label="वापस">←</a><a class="brand" href="mobile-app.html"><span class="brand-symbol">❀</span><span><b>साहित्य सूत्रधार</b><small>शब्दों का अपना संसार</small></span></a><button id="readerTextSettings" class="round-btn" aria-label="पाठ सेटिंग">अ</button></header>
<main id="readerMain" class="reader-main">
<div id="readerState" class="reader-state">रचना खोली जा रही है…</div>
<article id="readerArticle" hidden>
<div id="readerCoverWrap" class="reader-cover-wrap" hidden><img id="readerCover" alt="रचना का आवरण"></div>
<div class="reader-heading"><div class="reader-kicker" id="readerType">साहित्य</div><h1 id="readerTitle"></h1><p id="readerAuthor"></p><div class="reader-meta" id="readerMeta"></div></div>
<div class="reader-progress"><div class="reader-progress-track"><span id="readerProgressBar"></span></div><small id="readerProgressText">0% पढ़ा</small></div>
<div id="readerContent" class="reader-content"></div>
<div class="reader-end" id="readerEnd">— रचना समाप्त —</div>
<section id="seriesPanel" class="series-panel" hidden><h2 id="seriesTitle">इस धारावाहिक के भाग</h2><div id="seriesLinks"></div></section>
<div class="reader-actions"><button id="readerBackBottom" type="button">← वापस</button><button id="readerShare" type="button">साझा करें ↗</button></div>
</article>
</main>
<div id="readerSettings" class="reader-settings" hidden><label>अक्षर आकार <input id="fontSizeControl" type="range" min="16" max="28" value="20"></label><label>पंक्ति दूरी <input id="lineHeightControl" type="range" min="15" max="24" value="19"></label></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="mobile-reader.js?v=1"></script>
</body></html>
