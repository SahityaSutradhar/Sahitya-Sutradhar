<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>सूत्रधार · सुरक्षित पुस्तक पाठक</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211b19;color:#f8ecd8;font-family:system-ui,sans-serif}.bar{height:48px;padding:10px 14px;background:#342523;display:flex;justify-content:space-between;align-items:center}.viewer{position:fixed;inset:48px 0 0}.viewer iframe{width:100%;height:100%;border:0;background:white}.watermark{position:fixed;inset:48px 0 0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(6,1fr);pointer-events:none;z-index:4;opacity:.15;overflow:hidden}.watermark span{display:flex;align-items:center;justify-content:center;white-space:nowrap;color:#8c1e30;font-weight:800;font-size:12px;transform:rotate(-25deg)}button{border:0;border-radius:8px;padding:6px 10px;background:#8b3b43;color:white}
</style>
</head>
<body>
<div class="bar"><strong>सूत्रधार · सुरक्षित पुस्तक पाठक</strong><button onclick="history.back()">वापस</button></div>
<div class="viewer"><iframe id="pdf" title="पुस्तक PDF" referrerpolicy="no-referrer"></iframe></div>
<div class="watermark" id="watermark" aria-hidden="true"></div>
<script>
(()=>{const p=new URLSearchParams(location.search),src=p.get("src"),uid=p.get("u")||"पाठक";if(!src||!src.startsWith("https://")){document.body.innerHTML="<p>PDF लिंक अमान्य या समाप्त हो गया है।</p>";return;}document.getElementById("pdf").src=src+"#toolbar=0&navpanes=0";const label="सूत्रधार · सुरक्षित प्रति · "+uid.slice(0,6)+"…"+uid.slice(-4);document.getElementById("watermark").innerHTML=Array.from({length:12},()=>"<span>"+label+"</span>").join("");document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["s","p","u"].includes(e.key.toLowerCase()))e.preventDefault();});})();
</script>
</body>
</html>
